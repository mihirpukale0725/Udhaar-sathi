# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: udhaar-saathi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # The free plan has no persistent disk, so the SQLite file is lost on every
    # deploy/restart (and free instances restart after ~15 min idle).
    # We seed fresh demo data on each start, so the demo always works.
    startCommand: python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      # Optional. Render asks for it when you create the Blueprint.
      # Leave it empty to run on the offline rules parser only.
      - key: GEMINI_API_KEY
        sync: false
      # Random 256-bit secret generated by Render; never stored in the repo.
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SHOP_NAME
        value: Saathi Kirana Store
      # Payment links use RENDER_EXTERNAL_URL, which Render sets automatically.
